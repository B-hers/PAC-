<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f0; color: #1a1a1a; font-size: 14px; }
input, select, textarea { font-family: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid #d0d0c8; border-radius: 6px; background: #fff; color: #1a1a1a; outline: none; transition: border-color 0.15s; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: #1B6B3A; }
input[type="checkbox"], input[type="radio"] { width: auto; }
button { font-family: inherit; cursor: pointer; }
label { font-size: 12px; color: #555; font-weight: 600; display: block; margin-bottom: 4px; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.g4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.preview-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 4px; }
.preview-table td, .preview-table th { padding: 6px 10px; border: 0.5px solid #ddd; text-align: left; vertical-align: top; }
.preview-table th { background: #f0f7f2; font-weight: 500; width: 36%; color: #1B6B3A; }
.preview-table.compact td, .preview-table.compact th { padding: 4px 8px; font-size: 12px; }
.preview-table.devis-table { border: 1px solid #e4e6de; border-radius: 9px; overflow: hidden; border-collapse: separate; border-spacing: 0; }
.preview-table.devis-table th { background: #1B6B3A; color: #fff; width: auto; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.4px; border-color: #1B6B3A; }
.preview-table.devis-table td { border-color: #e4e6de; }
.preview-table.devis-table tbody tr:nth-child(even) { background: #f4f4f0; }
@media print {
  @page { size: A4 portrait; margin: 12mm 14mm; }
  body { background: white; margin: 0; }
  .no-print { display: none !important; }
  .print-doc { display: block !important; }
  img { max-width: 100%; }
  .avoid-break { page-break-inside: avoid; break-inside: avoid; }
  .page-break { page-break-before: always; break-before: page; }
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  input, select, textarea { font-size: 16px !important; padding: 10px 12px; }
  button { min-height: 42px; }
}
</style>

/* ============================== HELPERS DE CALCUL ============================== */
function suggestIndoor(watts, gamme) {
  if (!watts || watts <= 0) return null;
  const g = gamme || GAMMES[0];
  const inGamme = INDOOR_UNITS.filter(u => u.gamme === g).sort((a, b) => a.index - b.index);
  const found = inGamme.find(u => watts <= (BTU_CLASS_MAXW[u.index] || Infinity));
  return found || null;
}
function suggestOutdoor(rooms) {
  const n = rooms.length;
  if (n === 0) return { ok: false, msg: "Aucune unité intérieure rattachée." };
  if (n === 1) {
    const uiCode = rooms[0].suggestedCode;
    const price = uiCode ? MONO_OUTDOOR[uiCode] : null;
    if (uiCode && price != null) {
      const ui = INDOOR_UNITS.find(u => u.code === uiCode);
      return { ok: true, mono: true, code: ui ? ui.monoCode : null, uiCode, price };
    }
    return { ok: true, mono: true, code: null, uiCode, price: null,
      msg: "Modèle mono-split hors table de référence, à confirmer avec le fournisseur." };
  }
  const sumIndex = rooms.reduce((s, r) => s + (r.indexVal || 0), 0);
  const candidates = OUTDOOR_UNITS.filter(u => u.nb.includes(n) && sumIndex >= u.min && sumIndex <= u.max);
  if (candidates.length === 0) {
    return { ok: false, msg: `Combinaison hors gamme standard (${n} unités, index cumulé ${sumIndex}) : étude spécifique nécessaire.` };
  }
  candidates.sort((a, b) => a.price - b.price);
  return { ok: true, mono: false, best: candidates[0], alternatives: candidates.slice(1), sumIndex, n };
}
// Puissance indicative d'une pièce à partir de sa surface saisie directement (m²) et de son isolation.
function computeRoomPower(room) {
  const surface = parseFloat(room.surface) || 0;
  const isolation = ISOLATION_OPTIONS.find(o => o.key === room.isolation);
  const majoration = (room.particularites || []).length >= 1;
  let watts = surface * (isolation ? isolation.coeff : 0);
  if (majoration) watts *= 1.15;
  watts = Math.round(watts);
  const suggestion = suggestIndoor(watts, room.gamme);
  return { surface, isolation, majoration, watts, suggestion };
}
// Unité intérieure effectivement retenue pour une pièce : le choix manuel du technicien
// (room.overrideCode) prévaut sur la suggestion automatique.
function getEffectiveIndoorUnit(room) {
  const { suggestion } = computeRoomPower(room);
  const code = room.overrideCode || (suggestion ? suggestion.code : null);
  if (!code) return null;
  return INDOOR_UNITS.find(u => u.code === code) || null;
}
// Vérifie la compatibilité d'une unité extérieure choisie manuellement avec les unités
// intérieures qui lui sont raccordées (nombre de raccordements + puissance cumulée).
function validateOutdoorChoice(code, assignedUnits) {
  const n = assignedUnits.length;
  if (!code || n === 0) return { ok: null };
  if (n === 1) {
    if (MONO_OUTDOOR[code] != null) return { ok: true };
    const mu = OUTDOOR_UNITS.find(o => o.code === code);
    if (mu && mu.nb.includes(1)) return { ok: true };
    return { ok: false, reason: "Ce modèle nécessite au moins 2 unités intérieures raccordées (configuration mono-split attendue ici)." };
  }
  const u = OUTDOOR_UNITS.find(o => o.code === code);
  if (!u) return { ok: false, reason: "Modèle hors catalogue standard multi-split." };
  if (!u.nb.includes(n)) return { ok: false, reason: `Ce modèle accepte ${u.nb.join(" ou ")} unité(s) raccordée(s), pas ${n}.` };
  const sumIndex = assignedUnits.reduce((s, x) => s + (x ? x.index : 0), 0);
  if (sumIndex < u.min || sumIndex > u.max) {
    return { ok: false, reason: `Puissance cumulée des unités intérieures (index ${sumIndex}) hors plage ${u.min}-${u.max} pour ce modèle.` };
  }
  return { ok: true };
}
/* ============================== LONGUEURS DE TUYAUTERIE (specs constructeur LG) ============================== */
// RAC (mono-split), par classe BTU de l'unité intérieure retenue (voir BTU_CLASS_MAXW pour la correspondance).
// Classes 5, 7 et 15 absentes de la fiche fournie par le fournisseur : extrapolées sur la classe la plus proche
// (5 et 7 -> classe 9 ; 15 -> classe 12, choix conservateur). À confirmer si vous disposez des valeurs exactes.
const RAC_PIPE_SPECS = {
  9: { maxLength: 15, maxDeniv: 7 },
  12: { maxLength: 15, maxDeniv: 7 },
  18: { maxLength: 20, maxDeniv: 10 },
  24: { maxLength: 30, maxDeniv: 15 },
};
function getRacPipeSpec(index) {
  if (RAC_PIPE_SPECS[index]) return RAC_PIPE_SPECS[index];
  if (index < 9) return RAC_PIPE_SPECS[9];
  if (index < 18) return RAC_PIPE_SPECS[12];
  return RAC_PIPE_SPECS[24];
}
// Multi F, par famille d'unité extérieure (préfixe du code, ex. "MU3R" pour MU3R19/MU3R21).
const MULTIF_PIPE_SPECS = {
  MU2R: { maxTotal: 30, maxPerPort: 20, maxDeniv: 15 },
  MU3R: { maxTotal: 50, maxPerPort: 25, maxDeniv: 15 },
  MU4R: { maxTotal: 70, maxPerPort: 25, maxDeniv: 15 },
  MU5R: { maxTotal: 75, maxPerPort: 25, maxDeniv: 15 },
};
function getMultiFPipeSpec(code) {
  const m = code && code.match(/^(MU\dR)/);
  return m ? MULTIF_PIPE_SPECS[m[1]] : null;
}
// Vérifie les distances déclarées (tuyauterie frigorifique) par rapport aux longueurs maximales théoriques
// constructeur. roomsWithUnit : [{ nom, distanceUE, effectiveIndex }]. Retourne un message d'alerte ou null.
function checkPipeLengths(roomsWithUnit, mono, outdoorCode) {
  const withDist = roomsWithUnit.filter(r => r.distanceUE && parseFloat(r.distanceUE) > 0);
  if (withDist.length === 0) return null;
  if (mono) {
    const r = withDist[0];
    const spec = getRacPipeSpec(r.effectiveIndex || 9);
    const d = parseFloat(r.distanceUE);
    if (d > spec.maxLength) {
      return `Distance déclarée (${d} m) supérieure à la longueur maximale théorique LG pour cette unité (${spec.maxLength} m). Dénivellation max théorique : ${spec.maxDeniv} m. À valider avec le fournisseur avant chantier.`;
    }
    return null;
  }
  const spec = getMultiFPipeSpec(outdoorCode);
  if (!spec) return null;
  const total = withDist.reduce((s, r) => s + (parseFloat(r.distanceUE) || 0), 0);
  const overPort = withDist.filter(r => parseFloat(r.distanceUE) > spec.maxPerPort);
  const issues = [];
  if (total > spec.maxTotal) issues.push(`longueur cumulée (${total.toFixed(1)} m) supérieure au maximum théorique (${spec.maxTotal} m)`);
  if (overPort.length > 0) issues.push(`distance par port supérieure au maximum (${spec.maxPerPort} m) pour : ${overPort.map(r => r.nom || "pièce").join(", ")}`);
  if (issues.length === 0) return null;
  return `Tuyauterie frigorifique : ${issues.join(" ; ")}. Dénivellation max théorique : ${spec.maxDeniv} m. À valider avec le fournisseur avant chantier.`;
}
// Calcul complet du devis : lignes de coût (matériel + services), frais annexes, marge et commission.
// Chaque ligne porte une clé stable (pricing.overrides[key]) permettant une surcharge manuelle du tarif,
// utilisée par l'onglet "Calcul du prix" pour le code couleur des lignes modifiées.
function computeDevisBreakdown(data, pricing) {
  const overrides = pricing.overrides || {};
  const lines = [];
  let coutMateriel = 0;

  function pushLine(key, label, code, qty, defaultTotal) {
    const ov = overrides[key];
    const has = ov !== undefined && ov !== null && ov !== "";
    const total = has ? (parseFloat(ov) || 0) : defaultTotal;
    const unitPrice = (typeof qty === "number" && qty > 0) ? total / qty : total;
    lines.push({ key, label, code: code || "", qty, unitPrice, total, defaultTotal, overridden: has });
    coutMateriel += total;
  }

  data.pac.outdoorUnits.forEach((u, i) => {
    const assignedRooms = data.pac.rooms.filter(r => (u.roomIds || []).includes(r.id));
    const effective = assignedRooms.map(r => ({ room: r, unit: getEffectiveIndoorUnit(r) }));
    const n = effective.length;
    const sumIndex = effective.reduce((s, x) => s + (x.unit ? x.unit.index : 0), 0);
    let outdoorCode = u.overrideCode || "";
    let outdoorPrice = 0;
    if (!outdoorCode) {
      if (n === 1) {
        const c = effective[0].unit ? effective[0].unit.code : null;
        if (c && MONO_OUTDOOR[c] != null) { outdoorCode = effective[0].unit.monoCode || c; outdoorPrice = MONO_OUTDOOR[c]; }
      } else if (n >= 2) {
        const cand = OUTDOOR_UNITS.filter(o => o.nb.includes(n) && sumIndex >= o.min && sumIndex <= o.max).sort((a, b) => a.price - b.price)[0];
        if (cand) { outdoorCode = cand.code; outdoorPrice = cand.price; }
      }
    } else {
      outdoorPrice = MONO_OUTDOOR[outdoorCode] != null ? MONO_OUTDOOR[outdoorCode] : ((OUTDOOR_UNITS.find(o => o.code === outdoorCode) || {}).price || 0);
    }
    if (outdoorCode) {
      pushLine(`ue-${u.id}`, `Unité extérieure ${i + 1} (${u.emplacement || "emplacement à définir"})`, outdoorCode, 1, outdoorPrice);
    } else if (n > 0) {
      pushLine(`ue-${u.id}`, `Unité extérieure ${i + 1} (${u.emplacement || "emplacement à définir"})`, "à définir", 1, 0);
    }
    effective.forEach(({ room, unit }) => {
      if (unit) {
        pushLine(`ui-${room.id}`, `Unité intérieure - ${room.nom || "pièce"}`, unit.code, 1, unit.price);
        pushLine(`mo-${room.id}`, `Main d'oeuvre - ${room.nom || "pièce"}`, "", 1, DEFAULT_MAIN_OEUVRE_PAR_UI);
        if (room.distanceUE && parseFloat(room.distanceUE) > TUBAGE_INCLUS_M) {
          const suppM = parseFloat(room.distanceUE) - TUBAGE_INCLUS_M;
          pushLine(`tubage-${room.id}`, `Tubage suppl. - ${room.nom || "pièce"}`, "", suppM.toFixed(1) + " m", suppM * DEFAULT_TUBAGE_PAR_M);
        }
        if (room.solutionCondensats && room.solutionCondensats.indexOf("Pompe de relevage") === 0) {
          pushLine(`relevage-${room.id}`, `Pompe de relevage - ${room.nom || "pièce"}`, "", 1, DEFAULT_POMPE_RELEVAGE);
        }
      }
    });
  });

  if (data.modules.boiler && data.boiler.volumeSouhaite) {
    const b = BOILERS.find(x => x.key === data.boiler.volumeSouhaite);
    if (b) {
      pushLine("boiler", b.label, b.ref, 1, b.price);
      if (b.split) {
        pushLine("boiler-ue", CALYPSO_OUTDOOR.label, CALYPSO_OUTDOOR.ref, 1, CALYPSO_OUTDOOR.price);
      }
      pushLine("boiler-mo", "Main d'oeuvre installation boiler", "", 1, DEFAULT_BOILER_MO_INSTALLATION);
      pushLine("boiler-raccord", "Matériel de raccord (groupe de sécurité, raccords, vase d'expansion)", "", 1, DEFAULT_BOILER_RACCORD_MATERIEL);
      if (data.boiler.aEvacuer) {
        pushLine("boiler-evacuation", "Évacuation de l'ancien boiler", "", 1, DEFAULT_BOILER_EVACUATION_ANCIEN);
      }
      if (b.hasCoil) {
        pushLine("boiler-coil", "Raccordement coil (serpentin) à la chaudière", "", 1, DEFAULT_BOILER_COIL_SUPPLEMENT);
      }
      if (data.boiler.sortieAir === "mur6") {
        pushLine("boiler-prise-air", "Prise d'air en traversée de mur extérieur (jusqu'à 6 m)", "", 1, DEFAULT_BOILER_PRISE_AIR_MUR);
      }
      // Raccordement électrique du boiler : inclus (pas de ligne). Sortie d'air en toiture ou traversée
      // de mur > 6 m : prix sur mesure, non chiffré ici (voir alerte dans l'onglet Boiler).
    }
  }

  if (data.modules.pac) {
    const distanceElec = parseFloat(data.elec && data.elec.distance) || 0;
    const nbUE = data.pac.outdoorUnits.length;
    if (nbUE > 0) {
      pushLine("raccordement-elec", `Raccordement électrique (câble 3G2,5) · ${nbUE} unité(s) extérieure(s)`, "", nbUE, nbUE * distanceElec * DEFAULT_RACCORDEMENT_ELEC_PAR_M);
    }
  }

  const fraisAnnexes = parseFloat(pricing.fraisAnnexes) || 0;
  const coutTotal = coutMateriel + fraisAnnexes;
  const multiplicateur = parseFloat(pricing.multiplicateur) || 1;
  const prixVente = coutTotal * multiplicateur;
  const marge = prixVente - coutTotal;
  const margePct = coutTotal ? (marge / coutTotal) * 100 : 0;
  const commissionPct = parseFloat(pricing.commissionPct) || 0;
  const commission = marge * (commissionPct / 100);
  const prixFinal = prixVente + commission;

  return { lines, coutMateriel, fraisAnnexes, coutTotal, multiplicateur, prixVente, marge, margePct, commissionPct, commission, prixFinal };
}
function estimCableSection(amps) {
  if (!amps) return "-";
  if (amps <= 10) return "1,5 mm²";
  if (amps <= 16) return "2,5 mm²";
  if (amps <= 20) return "4 mm²";
  if (amps <= 25) return "6 mm²";
  if (amps <= 32) return "6 à 10 mm²";
  return "à calculer par l'électricien (>32A)";
}
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================== ANNOTATION (dessin libre sur photo) ============================== */
function AnnotationModal({ photo, onSave, onClose }) {
  const canvasRef = useRef(null);
  const [strokes, setStrokes] = useState(photo.strokes || []);
  const [color, setColor] = useState("#e74c3c");
  const [thickness, setThickness] = useState(5);
  const [drawing, setDrawing] = useState(false);
  const [textMode, setTextMode] = useState(false);
  const imgRef = useRef(null);
  const dims = useRef({ w: 600, h: 400 });

  React.useEffect(() => {
    const img = new Image();
    img.onload = () => {
      const maxW = Math.min(760, window.innerWidth - 40);
      const scale = Math.min(1, maxW / img.width);
      dims.current = { w: img.width * scale, h: img.height * scale };
      imgRef.current = img;
      redraw();
    };
    img.src = photo.url;
  }, []);

  function redraw() {
    const canvas = canvasRef.current;
    if (!canvas || !imgRef.current) return;
    canvas.width = dims.current.w;
    canvas.height = dims.current.h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imgRef.current, 0, 0, canvas.width, canvas.height);
    strokes.forEach(s => {
      if (s.type === "text") {
        ctx.fillStyle = s.color;
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(s.text, s.x, s.y);
      } else {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.thickness;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        s.points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
        ctx.stroke();
      }
    });
  }
  React.useEffect(redraw, [strokes]);

  function getPos(e) {
    const rect = canvasRef.current.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function onDown(e) {
    e.preventDefault();
    const pos = getPos(e);
    if (textMode) {
      const txt = window.prompt("Texte de l'annotation :", "");
      if (txt) setStrokes(s => [...s, { type: "text", text: txt, x: pos.x, y: pos.y, color }]);
      setTextMode(false);
      return;
    }
    setDrawing(true);
    setStrokes(s => [...s, { type: "stroke", color, thickness, points: [pos] }]);
  }
  function onMove(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e);
    setStrokes(s => {
      const copy = s.slice();
      const last = copy[copy.length - 1];
      last.points = [...last.points, pos];
      return copy;
    });
  }
  function onUp() { setDrawing(false); }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 999, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div style={{ background: WHITE, borderRadius: 12, padding: 16, maxWidth: 820, width: "100%", maxHeight: "92vh", overflow: "auto" }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: 10 }}>
          {["#e74c3c", "#2980b9", "#f39c12", "#111111", "#27ae60"].map(c => (
            <button key={c} onClick={() => setColor(c)} style={{ width: 26, height: 26, borderRadius: "50%", background: c, border: color === c ? "3px solid #999" : "1px solid #ccc" }} />
          ))}
          <input type="range" min="2" max="14" value={thickness} onChange={e => setThickness(+e.target.value)} style={{ width: 100 }} />
          <button onClick={() => setTextMode(t => !t)} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid " + (textMode ? GREEN : BORDER), background: textMode ? GREEN_LIGHT : WHITE, fontWeight: 600, fontSize: 12 }}>🔤 Texte</button>
          <button onClick={() => setStrokes(s => s.slice(0, -1))} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid " + BORDER, background: WHITE, fontSize: 12 }}>↩ Annuler</button>
          <button onClick={() => setStrokes([])} style={{ padding: "6px 12px", borderRadius: 6, border: "1px solid " + BORDER, background: WHITE, fontSize: 12 }}>🗑 Tout effacer</button>
        </div>
        <canvas
          ref={canvasRef}
          style={{ width: "100%", touchAction: "none", border: "1px solid " + BORDER, borderRadius: 6, cursor: textMode ? "text" : "crosshair" }}
          onMouseDown={onDown} onMouseMove={onMove} onMouseUp={onUp} onMouseLeave={onUp}
          onTouchStart={onDown} onTouchMove={onMove} onTouchEnd={onUp}
        />
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 12 }}>
          <button onClick={onClose} style={{ padding: "9px 16px", borderRadius: 8, border: "1px solid " + BORDER, background: WHITE, fontWeight: 600 }}>Annuler</button>
          <button onClick={() => onSave(canvasRef.current.toDataURL("image/jpeg", 0.85), strokes)} style={{ padding: "9px 16px", borderRadius: 8, border: "none", background: GREEN, color: WHITE, fontWeight: 700 }}>✓ Enregistrer</button>
        </div>
      </div>
    </div>
  );
}

function PhotoPicker({ label, hint, photos, onChange }) {
  const [annotating, setAnnotating] = useState(null);
  const inputRef = useRef(null);

  async function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    const news = await Promise.all(files.map(async f => ({ id: uid(), url: await fileToDataUrl(f), note: "", strokes: [] })));
    onChange([...(photos || []), ...news]);
    e.target.value = "";
  }
  function remove(id) { onChange(photos.filter(p => p.id !== id)); }
  function updateNote(id, note) { onChange(photos.map(p => p.id === id ? { ...p, note } : p)); }
  function saveAnnotation(id, dataUrl, strokes) {
    onChange(photos.map(p => p.id === id ? { ...p, url: dataUrl, strokes } : p));
    setAnnotating(null);
  }

  return (
    <div style={{ marginBottom: 14 }}>
      <label>{label}</label>
      {hint && <div style={{ fontSize: 11, color: MUTED, marginBottom: 6 }}>{hint}</div>}

              <button onClick={() => setAnnotating(p)} title="Annoter" style={{ width: 22, height: 22, borderRadius: 5, border: "none", background: "rgba(0,0,0,0.55)", color: WHITE, fontSize: 11 }}>✎</button>
              <button onClick={() => remove(p.id)} title="Supprimer" style={{ width: 22, height: 22, borderRadius: 5, border: "none", background: "rgba(192,57,43,0.85)", color: WHITE, fontSize: 11 }}>✕</button>
            </div>
            <input className="no-print" placeholder="Note (ex: distance, remarque)" value={p.note} onChange={e => updateNote(p.id, e.target.value)}
              style={{ fontSize: 11, padding: "4px 6px", marginTop: 3 }} />
            {p.note && <div style={{ display: "none" }}>{p.note}</div>}

        ))}

          style={{ height: 90, borderRadius: 8, border: "2px dashed " + BORDER, background: BG, color: MUTED, fontSize: 24 }}>+</button>
      </div>
      <input ref={inputRef} type="file" accept="image/*" capture="environment" multiple onChange={handleFiles} style={{ display: "none" }} />
      {annotating && <AnnotationModal photo={annotating} onClose={() => setAnnotating(null)} onSave={(url, strokes) => saveAnnotation(annotating.id, url, strokes)} />}
    </div>
  );
}

              {INDOOR_UNITS.filter(u => u.gamme === g).map(u => (
                <option key={u.code} value={u.code}>{shortModelCode(u.code)} · {u.kwFroid} / {u.kwChaud} kW · {u.price.toFixed(0)} €</option>
              ))}
            </optgroup>
          ))}
        </select>
        {room.overrideCode && suggestion && room.overrideCode !== suggestion.code && (
          <div style={{ fontSize: 11.5, color: ORANGE, marginTop: 4 }}>⚠ Différent de la suggestion automatique ({shortModelCode(suggestion.code)}) : à valider par le chauffagiste.</div>

      <div style={{ borderTop: `1px dashed ${BORDER}`, paddingTop: 12 }}>
        <div className="g2">
          <Field label="Emplacement exact dans la pièce">
            <input value={room.emplacement} onChange={e => set({ emplacement: e.target.value })} placeholder="Ex: mur nord, au-dessus de la porte" />
          </Field>
          <Field label="Distance estimée vers l'unité extérieure (m)" hint="À la règle ou via l'app Mesure de l'iPhone.">
            <input type="number" step="0.5" value={room.distanceUE} onChange={e => set({ distanceUE: e.target.value })} />
          </Field>
          <Field label="Niveau de l'unité intérieure par rapport à l'unité extérieure">
            <select value={room.niveauUE} onChange={e => set({ niveauUE: e.target.value, solutionCondensats: e.target.value === NIVEAU_UE_OPTIONS[1] ? room.solutionCondensats : "" })}>
              <option value="">Sélectionner...</option>
              {NIVEAU_UE_OPTIONS.map(o => <option key={o}>{o}</option>)}

        </div>
        {room.distanceUE && parseFloat(room.distanceUE) > TUBAGE_INCLUS_M && (

        )}
        {enContrebas && (
          <div>

            <Field label="Solution retenue pour l'évacuation des condensats">

              </select>

        )}
        <PhotoPicker label="Photos du tubage vers l'unité extérieure (trajet des conduites)" photos={room.photosTubage} onChange={p => set({ photosTubage: p })} />

      </div>
    </Card>
  );

/* ============================== UNITÉ EXTÉRIEURE ============================== */
function OutdoorUnitCard({ ue, idx, rooms, onChange, onRemove }) {
  const set = (patch) => onChange({ ...ue, ...patch });
  const eligibleRooms = rooms.filter(r => r.nom);
  const assigned = eligibleRooms.filter(r => (ue.roomIds || []).includes(r.id)).map(r => {
    const { suggestion } = computeRoomPower(r);
    return { ...r, suggestedCode: suggestion ? suggestion.code : null, indexVal: suggestion ? suggestion.index : 0 };
  });
  const result = suggestOutdoor(assigned);
  // Unités effectivement retenues (tenant compte d'un éventuel choix manuel par pièce), pour la validation de compatibilité.
  const effectiveUnits = assigned.map(r => getEffectiveIndoorUnit(r));
  const compat = ue.overrideCode ? validateOutdoorChoice(ue.overrideCode, effectiveUnits) : { ok: null };

  // Alerte technique : distances déclarées vs longueurs/dénivellations maximales théoriques constructeur LG.
  const roomsWithUnit = assigned.map((r, i) => ({ nom: r.nom, distanceUE: r.distanceUE, effectiveIndex: effectiveUnits[i] ? effectiveUnits[i].index : r.indexVal }));
  const effectiveOutdoorCode = ue.overrideCode || (result.ok && !result.mono ? result.best.code : null);
  const pipeWarning = result.ok ? checkPipeLengths(roomsWithUnit, result.mono, effectiveOutdoorCode) : null;

  function toggleRoom(id) {
    const set2 = new Set(ue.roomIds || []);
    set2.has(id) ? set2.delete(id) : set2.add(id);
    set({ roomIds: Array.from(set2) });
  }

  return (
    <Card title={`Unité extérieure ${idx + 1} : ${ue.emplacement || "emplacement à définir"}`} badge={`${assigned.length} raccordement(s)`} onRemove={onRemove}>
      <Field label="Emplacement envisagé"><input value={ue.emplacement} onChange={e => set({ emplacement: e.target.value })} placeholder="Ex: façade arrière, sur plots au sol" /></Field>

      <Field label="Unités intérieures raccordées à cette unité extérieure">
        {eligibleRooms.length === 0 && <div style={{ fontSize: 12, color: MUTED }}>Aucune pièce avec unité intérieure prévue pour le moment.</div>}
        <CheckboxGroup options={eligibleRooms.map(r => r.nom)} values={eligibleRooms.filter(r => (ue.roomIds || []).includes(r.id)).map(r => r.nom)}
          onChange={(names) => { const ids = eligibleRooms.filter(r => names.includes(r.nom)).map(r => r.id); set({ roomIds: ids }); }} columns={2} />
      </Field>

      {result.ok ? (
        result.mono ? (
          <Alert type="info">Configuration mono-split : unité extérieure <strong>{result.code ? shortModelCode(result.code) : "-"}</strong>{result.price ? ` (≈ ${result.price.toFixed(0)} € coût We Green)` : ""}.{result.msg ? " " + result.msg : ""}</Alert>
        ) : (
          <Alert type="info">
            Unité extérieure suggérée : <strong>{shortModelCode(result.best.code)}</strong> ({result.best.kwChaud ? result.best.kwChaud + " kW chaud" : ""}, ≈ {result.best.price.toFixed(0)} € coût We Green)
            {result.alternatives.length > 0 && <>. Alternatives possibles : {result.alternatives.map(a => shortModelCode(a.code)).join(", ")}</>}
          </Alert>
        )
      ) : (
        <Alert type="error">{result.msg}</Alert>
      )}
      {pipeWarning && <Alert type="warn">⚠ {pipeWarning}</Alert>}

      <Field label="Modèle d'unité extérieure retenu" hint="Suggestion automatique par défaut (configuration multi-split), modifiable si un autre modèle est souhaité.">
        <select value={ue.overrideCode || ""} onChange={e => set({ overrideCode: e.target.value })}>
          <option value="">Suggestion automatique{result.ok ? ` (${result.mono ? (result.code ? shortModelCode(result.code) : "-") : shortModelCode(result.best.code)})` : ""}</option>
          {OUTDOOR_UNITS.map(o => <option key={o.code} value={o.code}>{shortModelCode(o.code)} · {o.kwChaud ? o.kwChaud + " kW chaud" : "-"} · {o.price.toFixed(0)} €</option>)}
        </select>
        {ue.overrideCode && compat.ok === true && (
          <div style={{ fontSize: 11.5, color: GREEN, marginTop: 4, fontWeight: 700 }}>✓ Compatible avec les unités intérieures sélectionnées.</div>
        )}
        {ue.overrideCode && compat.ok === false && (
          <div style={{ fontSize: 11.5, color: RED, marginTop: 4, fontWeight: 700 }}>⚠ Non compatible : {compat.reason}</div>
        )}
      </Field>

      <div className="g3">
        <Field label="Mode de pose">
          <select value={ue.pose} onChange={e => set({ pose: e.target.value })}>
            <option value="">Sélectionner...</option>
            {POSE_UE_OPTIONS.map(o => <option key={o}>{o}</option>)}
          </select>
        </Field>
        <Field label="Évacuation des condensats (unité extérieure)">
          <select value={ue.condensats} onChange={e => set({ condensats: e.target.value })}>
            <option value="">À confirmer sur site...</option>
            <option>Prévue / possible</option>
            <option>Non prévue</option>
            <option>À confirmer sur site</option>
          </select>
        </Field>
        <Field label="Accessibilité pour l'installation">
          <select value={ue.accessibilite} onChange={e => set({ accessibilite: e.target.value })}>
            <option value="">Sélectionner...</option>
            <option>Facile (accès direct)</option>
            <option>Moyenne (échelle, escabeau)</option>
            <option>Difficile (nacelle/échafaudage nécessaire)</option>
          </select>
        </Field>
      </div>

      <Field label="Travaux nécessaires">
        <CheckboxGroup options={["Percement mur", "Goulottes apparentes", "Carottage", "Travaux en hauteur"]} values={ue.travaux} onChange={v => set({ travaux: v })} columns={2} />
      </Field>
      <Field label="Remarques (accès, esthétique, contraintes diverses)">
        <textarea rows="2" value={ue.remarque} onChange={e => set({ remarque: e.target.value })} />
      </Field>

      <PhotoPicker label="Photos de l'emplacement extérieur" photos={ue.photos} onChange={p => set({ photos: p })} />
    </Card>
  );
}

/* ============================== ONGLET PAC ============================== */
function PacTab({ pac, setPac }) {
  const set = (patch) => setPac({ ...pac, ...patch });
  const addRoom = () => set({ rooms: [...pac.rooms, { id: uid(), nom: "", surface: "", hauteur: "", isolation: "", particularites: [], gamme: GAMMES[0], overrideCode: "", emplacement: "", distanceUE: "", niveauUE: "", solutionCondensats: "", contraintes: "", photos: [], photosTubage: [] }] });
  const updateRoom = (id, room) => set({ rooms: pac.rooms.map(r => r.id === id ? room : r) });
  const removeRoom = (id) => set({ rooms: pac.rooms.filter(r => r.id !== id), outdoorUnits: pac.outdoorUnits.map(u => ({ ...u, roomIds: (u.roomIds || []).filter(rid => rid !== id) })) });

  const addUE = () => set({ outdoorUnits: [...pac.outdoorUnits, { id: uid(), emplacement: "", roomIds: [], pose: "", overrideCode: "", condensats: "", accessibilite: "", travaux: [], remarque: "", photos: [] }] });
  const updateUE = (id, ue) => set({ outdoorUnits: pac.outdoorUnits.map(u => u.id === id ? ue : u) });
  const removeUE = (id) => set({ outdoorUnits: pac.outdoorUnits.filter(u => u.id !== id) });

  return (
    <div>
      <SectionHeader sub="Pompe à chaleur air/air (mono ou multi-split), climatisation réversible.">1. Pompe à chaleur</SectionHeader>

      <div className="g2" style={{ marginBottom: 16 }}>
        <Field label="Type de projet">
          <select value={pac.typeProjet} onChange={e => set({ typeProjet: e.target.value })}>
            <option value="">Sélectionner...</option>
            <option>Neuf</option>
            <option>Rénovation</option>
          </select>
        </Field>
        <Field label="Usage souhaité">
          <select value={pac.usage} onChange={e => set({ usage: e.target.value })}>
            <option value="">Sélectionner...</option>
            <option>Chauffage + climatisation (réversible)</option>
            <option>Chauffage seul</option>
            <option>Climatisation seule</option>
          </select>
        </Field>
      </div>

      <datalist id="room-suggestions">{ROOM_SUGGESTIONS.map(r => <option key={r} value={r} />)}</datalist>

      <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 10 }}>Unités intérieures</h3>
      {pac.rooms.map((r, i) => <RoomCard key={r.id} room={r} idx={i} onChange={room => updateRoom(r.id, room)} onRemove={() => removeRoom(r.id)} />)}
      <button className="no-print" onClick={addRoom} style={{ padding: "10px 16px", borderRadius: 8, border: `1px dashed ${GREEN}`, background: GREEN_LIGHT, color: GREEN, fontWeight: 700, marginBottom: 24 }}>+ Ajouter une unité intérieure</button>

      <h3 style={{ fontSize: 15, fontWeight: 700, marginBottom: 10 }}>Unités extérieures</h3>
      {pac.outdoorUnits.map((u, i) => <OutdoorUnitCard key={u.id} ue={u} idx={i} rooms={pac.rooms} onChange={ue => updateUE(u.id, ue)} onRemove={() => removeUE(u.id)} />)}
      <button className="no-print" onClick={addUE} style={{ padding: "10px 16px", borderRadius: 8, border: `1px dashed ${GREEN}`, background: GREEN_LIGHT, color: GREEN, fontWeight: 700 }}>+ Ajouter une unité extérieure</button>
    </div>
  );
}

/* ============================== ONGLET ÉLECTRICITÉ ============================== */
function ElecTab({ elec, setElec, totalKwChaud, boilerActive }) {
  const set = (patch) => setElec({ ...elec, ...patch });
  const estimW = Math.round((totalKwChaud * 1000) / 3.5) + (boilerActive ? 2500 : 0); // SCOP moyen ≈3.5, indicatif
  const amps230 = estimW ? Math.round(estimW / 230) : 0;

  return (
    <div>
      <SectionHeader sub="Raccordement électrique de la/des unité(s) extérieure(s) et, le cas échéant, du boiler.">2. Alimentation électrique</SectionHeader>

      <Card title="Raccordement">
        <div className="g2">
          <Field label="Point de raccordement envisagé">
            <select value={elec.point} onChange={e => set({ point: e.target.value })}>
              <option value="">Sélectionner...</option>
              <option>Tableau électrique principal</option>
              <option>Tableau divisionnaire / secondaire</option>
              <option>Prise existante à proximité</option>
            </select>
          </Field>
          <Field label="Une prise existante peut-elle convenir ?">
            <select value={elec.priseExistante} onChange={e => set({ priseExistante: e.target.value })}>
              <option value="">Sélectionner...</option>
              <option>Oui</option>
              <option>Non, ligne dédiée nécessaire</option>
              <option>À vérifier</option>
            </select>
          </Field>
          <Field label="Distance équipement ↔ tableau (m)"><input type="number" step="0.5" value={elec.distance} onChange={e => set({ distance: e.target.value })} /></Field>
          <Field label="Type de réseau">
            <select value={elec.reseau} onChange={e => set({ reseau: e.target.value })}>
              <option value="">Sélectionner...</option>
              <option>Monophasé 230V</option>
              <option>Triphasé 230V (sans neutre)</option>
              <option>Triphasé 400V + neutre</option>
            </select>
          </Field>
        </div>
        <Field label="Cheminement possible du câble"><textarea rows="2" value={elec.cheminement} onChange={e => set({ cheminement: e.target.value })} placeholder="Faux plafond, gaine technique, apparent en goulotte..." /></Field>

        {estimW > 0 && (
          <Alert type="info">
            Puissance électrique estimée (indicatif, SCOP moyen ≈3,5{boilerActive ? " + boiler 2 500 W max" : ""}) : <strong>≈ {estimW} W</strong>
            {elec.reseau === "Monophasé 230V" && <> soit ≈ <strong>{amps230} A</strong></>}. Section de câble indicative : <strong>{estimCableSection(amps230)}</strong> (à valider par l'électricien selon distance réelle et mode de pose).
          </Alert>
        )}

        <div className="g2">
          <Field label="Puissance disponible actuellement au tableau (A)"><input type="number" value={elec.puissanceDispo} onChange={e => set({ puissanceDispo: e.target.value })} placeholder="Relevé sur place" /></Field>
          <Field label="Le tableau doit-il être adapté ?">
            <select value={elec.tableauAdapter} onChange={e => set({ tableauAdapter: e.target.value })}>
              <option value="">Sélectionner...</option>
              <option>Non, compatible en l'état</option>
              <option>Oui, ajout d'une protection</option>
              <option>Oui, augmentation de puissance nécessaire</option>
              <option>À vérifier</option>
            </select>
          </Field>
        </div>
        <Field label="Remarques"><textarea rows="2" value={elec.remarque} onChange={e => set({ remarque: e.target.value })} /></Field>
      </Card>

      <PhotoPicker label="Photos : compteur, tableau ouvert, tableau fermé, protections existantes, trajet du câble" photos={elec.photos} onChange={p => set({ photos: p })} />
    </div>
  );
}

/* ============================== ONGLET BOILER ============================== */
function BoilerTab({ boiler, setBoiler }) {
  const set = (patch) => setBoiler({ ...boiler, ...patch });
  const surface = parseFloat(boiler.surface) || 0;
  const volume = surface * (parseFloat(boiler.hauteur) || 0);
  const volOk = volume > 0 ? volume >= BOILER_VOLUME_MIN_PIECE : null;

  return (
    <div>
      <SectionHeader sub="Chauffe-eau thermodynamique Atlantic (gamme Explorer / Calypso, tarifs fournisseur Chauraci du 29/09/2026).">3. Boiler thermodynamique</SectionHeader>

      <Card title="Système de chauffage / production ECS actuel">
        <div className="g3">
          <Field label="Type de système actuel">
            <select value={boiler.systemeActuel} onChange={e => set({ systemeActuel: e.target.value })}>
              <option value="">Sélectionner...</option>
              <option>Chaudière (gaz/mazout) avec ballon</option>
              <option>Boiler électrique classique</option>
              <option>Boiler thermodynamique existant</option>
              <option>Autre</option>
            </select>
          </Field>
          <Field label="Volume actuel (L)"><input type="number" value={boiler.volumeActuel} onChange={e => set({ volumeActuel: e.target.value })} /></Field>
          <Field label="Âge / état approximatif"><input value={boiler.ageActuel} onChange={e => set({ ageActuel: e.target.value })} /></Field>
        </div>
        <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
          <input type="checkbox" checked={!!boiler.aEvacuer} onChange={e => set({ aEvacuer: e.target.checked })} />
          <span style={{ fontWeight: 400 }}>L'ancien système doit être évacué</span>
        </label>
      </Card>

      <Card title="Besoins">
        <div className="g2">
          <Field label="Nombre d'occupants"><input type="number" value={boiler.occupants} onChange={e => set({ occupants: e.target.value })} /></Field>
          <Field label="Modèle de boiler souhaité">
            <select value={boiler.volumeSouhaite} onChange={e => set({ volumeSouhaite: e.target.value })}>
              <option value="">À définir avec le chauffagiste...</option>
              {BOILERS.map(b => <option key={b.key} value={b.key}>{b.label}{b.hasCoil ? " (coil)" : ""}{b.split ? " (split)" : ""}</option>)}
            </select>
          </Field>
        </div>
        {boiler.occupants && (
          <Alert type="info">
            Repère indicatif : {parseInt(boiler.occupants) <= 2 ? "150-200 L suffit généralement pour 1-2 personnes." : parseInt(boiler.occupants) <= 4 ? "200-270 L selon usage pour 3-4 personnes." : "270 L conseillé au-delà de 4 personnes."} À confirmer avec le chauffagiste selon les habitudes de consommation.
          </Alert>
        )}
        {boiler.volumeSouhaite && (() => { const b = BOILERS.find(x => x.key === boiler.volumeSouhaite);
          if (!b) return null;
          const extras = [];
          if (b.hasCoil) extras.push(`serpentin à relier à une chaudière (+${DEFAULT_BOILER_COIL_SUPPLEMENT} € MO/matériel)`);
          if (b.split) extras.push(`ballon + unité extérieure dédiée (réf. UE ${CALYPSO_OUTDOOR.ref})`);
          return <div style={{ fontSize: 12.5, color: MUTED, marginTop: 4 }}>Réf. {b.ref} · {b.volume} L{extras.length ? " · " + extras.join(" · ") : ""}</div>;
        })()}
      </Card>

      <Card title="Emplacement du nouveau boiler">
        <div className="g3">
          <Field label="Pièce prévue"><input value={boiler.piece} onChange={e => set({ piece: e.target.value })} placeholder="Ex: buanderie, chaufferie, garage" /></Field>
          <Field label="Surface de la pièce (m²)"><input type="number" step="0.5" value={boiler.surface} onChange={e => set({ surface: e.target.value })} /></Field>
          <Field label="Hauteur sous plafond (m)"><input type="number" step="0.1" value={boiler.hauteur} onChange={e => set({ hauteur: e.target.value })} /></Field>
          <Field label="Volume (calc.)"><div style={{ padding: "7px 10px", background: BG, borderRadius: 6, fontWeight: 700 }}>{volume ? volume.toFixed(1) + " m³" : "-"}</div></Field>
          <Field label="Dimensions des accès (couloirs, portes, escaliers)"><input value={boiler.dimAcces} onChange={e => set({ dimAcces: e.target.value })} placeholder="Largeur porte la plus étroite, etc." /></Field>
        </div>
        {volOk === false && (
          <Alert type="warn">Volume de la pièce &lt; {BOILER_VOLUME_MIN_PIECE} m³ : la prise/rejet d'air ne peut pas se faire directement dans la pièce. Un gainage vers l'extérieur, les combles ou une autre pièce suffisamment volumineuse sera nécessaire.</Alert>
        )}
        {volOk === true && <Alert type="info">Volume ≥ {BOILER_VOLUME_MIN_PIECE} m³ : prise et rejet d'air directement dans la pièce possibles (sous réserve de validation chauffagiste).</Alert>}
        <Field label="Sortie de la prise d'air (si évacuation vers l'extérieur)">
          <select value={boiler.sortieAir} onChange={e => set({ sortieAir: e.target.value })}>
            <option value="">Sélectionner...</option>
            <option value="interieure">Prise/rejet dans la pièce (pas de traversée)</option>
            <option value="mur6">Traversée de mur extérieur, jusqu'à 6 m (+{DEFAULT_BOILER_PRISE_AIR_MUR} € HTVA)</option>
            <option value="mur-plus">Traversée de mur extérieur, plus de 6 m (prix sur mesure)</option>
            <option value="toiture">Sortie en toiture (prix sur demande)</option>
          </select>
        </Field>
        {(boiler.sortieAir === "mur-plus" || boiler.sortieAir === "toiture") && (
          <Alert type="warn">
            {boiler.sortieAir === "toiture" ? "Sortie en toiture : prix à établir sur mesure, non inclus dans le calcul automatique du devis." : "Traversée de mur > 6 m : prix à établir sur mesure, non inclus dans le calcul automatique du devis."}
          </Alert>
        )}
        <div className="g3">
          <Field label="Évacuation d'eau à proximité">
            <select value={boiler.evacEau} onChange={e => set({ evacEau: e.target.value })}><option value="">Sélectionner...</option><option>Oui</option><option>Non</option></select>
          </Field>
          <Field label="Raccordement électrique 230V à proximité">
            <select value={boiler.raccordElec} onChange={e => set({ raccordElec: e.target.value })}><option value="">Sélectionner...</option><option>Oui</option><option>Non</option></select>
          </Field>
          <Field label="Évacuation des condensats possible">
            <select value={boiler.condensats} onChange={e => set({ condensats: e.target.value })}>
              <option value="">À confirmer sur site...</option><option>Oui</option><option>Non</option><option>À confirmer sur site</option>
            </select>
          </Field>
        </div>
        {volOk === false && (
          <Field label="Longueur de gainage estimée (m)" hint={`${BOILER_GAINAGE_INCLUS_M} m inclus dans le forfait ; au-delà, supplément ≈45 €/m.`}>
            <input type="number" step="0.5" value={boiler.longueurGainage} onChange={e => set({ longueurGainage: e.target.value })} />
          </Field>
        )}
      </Card>

      <Card title="Raccordements hydrauliques (important)">
        <div className="g3">
          <Field label="Position arrivée eau froide"><input value={boiler.arriveeFroide} onChange={e => set({ arriveeFroide: e.target.value })} /></Field>
          <Field label="Position départ eau chaude"><input value={boiler.departChaude} onChange={e => set({ departChaude: e.target.value })} /></Field>
          <Field label="Position du collecteur sanitaire"><input value={boiler.collecteur} onChange={e => set({ collecteur: e.target.value })} /></Field>
        </div>
      </Card>

      <PhotoPicker label="Photos : boiler/chaudière existants, collecteur & raccordements, emplacement prévu, accès, évacuation condensats, tableau électrique, passages gaines d'air"
        photos={boiler.photos} onChange={p => set({ photos: p })} />
    </div>
  );
}

/* ============================== APERÇU / RAPPORT ============================== */
function ReportTab({ data }) {
  const missing = [];
  if (!data.client.nom) missing.push("Nom du client");
  if (!data.client.adresse) missing.push("Adresse du chantier");
  data.pac.rooms.forEach((r, i) => {
    if (!r.surface || !r.hauteur) missing.push(`Unité intérieure ${i + 1} (${r.nom || "sans nom"}) : dimensions incomplètes`);
    if (!r.isolation) missing.push(`Unité intérieure ${i + 1} (${r.nom || "sans nom"}) : isolation non renseignée`);
    if (!r.niveauUE) missing.push(`Unité intérieure ${i + 1} (${r.nom || "sans nom"}) : niveau par rapport à l'unité extérieure non renseigné`);
  });
  if (data.modules.boiler) {
    if (!data.boiler.piece) missing.push("Boiler : pièce d'emplacement non renseignée");
    if (!data.boiler.condensats) missing.push("Boiler : évacuation condensats à confirmer");
  }

  let total = 0;
  data.pac.outdoorUnits.forEach(u => {
    const eligible = data.pac.rooms.filter(r => (u.roomIds || []).includes(r.id)).map(r => {
      const { suggestion } = computeRoomPower(r);
      return { indexVal: suggestion ? suggestion.index : 0, price: suggestion ? suggestion.price : 0, code: suggestion ? suggestion.code : null };
    });
    const res = suggestOutdoor(eligible);
    if (res.ok) {
      if (res.mono && res.price) total += res.price;
      else if (!res.mono) total += res.best.price;
    }
    total += eligible.reduce((s, r) => s + (r.price || 0), 0);
  });
  if (data.modules.boiler && data.boiler.volumeSouhaite) {
    const b = BOILERS.find(x => x.key === data.boiler.volumeSouhaite);
    if (b) {
      total += b.price;
      if (b.split) total += CALYPSO_OUTDOOR.price;
      total += DEFAULT_BOILER_MO_INSTALLATION + DEFAULT_BOILER_RACCORD_MATERIEL;
      if (data.boiler.aEvacuer) total += DEFAULT_BOILER_EVACUATION_ANCIEN;
      if (b.hasCoil) total += DEFAULT_BOILER_COIL_SUPPLEMENT;
      if (data.boiler.sortieAir === "mur6") total += DEFAULT_BOILER_PRISE_AIR_MUR;
    }
  }

  const totalKwChaud = data.pac.outdoorUnits.reduce((sum, u) => {
    const eligible = data.pac.rooms.filter(r => (u.roomIds || []).includes(r.id));
    const res = suggestOutdoor(eligible.map(r => {
      const { suggestion } = computeRoomPower(r);
      return { indexVal: suggestion ? suggestion.index : 0, suggestedCode: suggestion ? suggestion.code : null };
    }));
    if (res.ok && !res.mono) return sum + (res.best.kwChaud || 0);
    return sum;
  }, 0);

  const tv = v => v || "-";

  return (
    <div>
      <div className="no-print" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <SectionHeader sub="Document de synthèse à transmettre à l'installateur / chauffagiste pour validation du dimensionnement avant chantier.">Briefing de chantier pour l'installateur</SectionHeader>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <button onClick={() => window.print()} style={{ padding: "9px 18px", borderRadius: 8, border: "none", background: GREEN, color: WHITE, fontWeight: 700 }}>🖨 Imprimer / Exporter PDF</button>
        </div>
      </div>

      {missing.length > 0 && (
        <div className="no-print">
          <Alert type="warn">
            <div style={{ marginBottom: 4 }}>⚠ Informations manquantes ({missing.length}) :</div>
            <ul style={{ marginLeft: 18 }}>{missing.map((m, i) => <li key={i}>{m}</li>)}</ul>
          </Alert>
        </div>
      )}

      <div className="print-doc">
        <div style={{ maxWidth: 760, margin: "0 auto", padding: "8px 4px", fontSize: 13, lineHeight: 1.55 }}>
          <div style={{ display: "flex", justifyContent: "space-between", borderBottom: `2px solid ${GREEN}`, paddingBottom: 12, marginBottom: 18 }}>
            <div>
              <div style={{ fontSize: 11, fontWeight: 700, color: GREEN, textTransform: "uppercase" }}>🌿 We Green Energy</div>
              <div style={{ fontSize: 21, fontWeight: 700 }}>Briefing de chantier pour l'installateur</div>
              <div style={{ fontSize: 12, color: MUTED, marginTop: 2 }}>Pompe à chaleur & Boiler thermodynamique</div>
            </div>
            <div style={{ textAlign: "right", color: MUTED }}>
              <div>{tv(data.chantier.date)}</div>
              <div style={{ fontWeight: 700, color: TEXT }}>{tv(data.chantier.technicien)}</div>
            </div>
          </div>

          <table className="preview-table avoid-break"><tbody>
            <tr><th>Client</th><td>{tv(data.client.nom)}</td></tr>
            <tr><th>Adresse</th><td>{tv(data.client.adresse)}</td></tr>
            <tr><th>Téléphone</th><td>{tv(data.client.tel)}</td></tr>
            <tr><th>Email</th><td>{tv(data.client.email)}</td></tr>
            <tr><th>Type de projet</th><td>{tv(data.pac.typeProjet)}</td></tr>
            <tr><th>Usage PAC</th><td>{tv(data.pac.usage)}</td></tr>
          </tbody></table>

          {data.modules.pac && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: GREEN, textTransform: "uppercase", marginBottom: 6 }}>Pièces & unités intérieures</div>
              <table className="preview-table avoid-break">
                <thead><tr><th>Pièce</th><th>Surface</th><th>Isolation</th><th>Puissance indic.</th><th>Unité suggérée</th><th>Condensats UI</th></tr></thead>
                <tbody>
                  {data.pac.rooms.map((r, i) => {
                    const { surface, watts, isolation, suggestion } = computeRoomPower(r);
                    const enContrebas = r.niveauUE === NIVEAU_UE_OPTIONS[1];
                    return <tr key={i}><td>{tv(r.nom)}</td><td>{surface ? surface.toFixed(1) + " m²" : "-"}</td><td>{isolation ? isolation.label : "-"}</td><td>{watts ? watts + " W" : "-"}</td><td>{suggestion ? shortModelCode(suggestion.code) : "hors gamme"}</td><td>{enContrebas ? (r.solutionCondensats || "en contrebas, solution à définir") : "-"}</td></tr>;
                  })}
                </tbody>
              </table>

              <div style={{ fontSize: 12, fontWeight: 700, color: GREEN, textTransform: "uppercase", margin: "14px 0 6px" }}>Unités extérieures</div>
              <table className="preview-table avoid-break">
                <thead><tr><th>Emplacement</th><th>Pose</th><th>Raccordements</th><th>Condensats</th><th>Accessibilité</th></tr></thead>
                <tbody>{data.pac.outdoorUnits.map((u, i) => <tr key={i}><td>{tv(u.emplacement)}</td><td>{tv(u.pose)}</td><td>{(u.roomIds || []).length}</td><td>{tv(u.condensats)}</td><td>{tv(u.accessibilite)}</td></tr>)}</tbody>
              </table>
            </div>
          )}

          <div style={{ marginTop: 18 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: GREEN, textTransform: "uppercase", marginBottom: 6 }}>Alimentation électrique</div>
            <table className="preview-table avoid-break"><tbody>
              <tr><th>Point de raccordement</th><td>{tv(data.elec.point)}</td></tr>
              <tr><th>Type de réseau</th><td>{tv(data.elec.reseau)}</td></tr>
              <tr><th>Distance au tableau</th><td>{data.elec.distance ? data.elec.distance + " m" : "-"}</td></tr>
              <tr><th>Tableau à adapter</th><td>{tv(data.elec.tableauAdapter)}</td></tr>
            </tbody></table>
          </div>

          {data.modules.boiler && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: GREEN, textTransform: "uppercase", marginBottom: 6 }}>Boiler thermodynamique</div>
              <table className="preview-table avoid-break"><tbody>
                <tr><th>Système actuel</th><td>{tv(data.boiler.systemeActuel)}{data.boiler.aEvacuer ? " (à évacuer)" : ""}</td></tr>
                <tr><th>Occupants</th><td>{tv(data.boiler.occupants)}</td></tr>
                <tr><th>Modèle souhaité</th><td>{(() => { const b = BOILERS.find(x => x.key === data.boiler.volumeSouhaite); return b ? `${b.label} (réf. ${b.ref})` : "-"; })()}</td></tr>
                <tr><th>Sortie prise d'air</th><td>{data.boiler.sortieAir === "mur6" ? `Traversée mur (≤ 6 m, +${DEFAULT_BOILER_PRISE_AIR_MUR} €)` : data.boiler.sortieAir === "mur-plus" ? "Traversée mur > 6 m (sur mesure)" : data.boiler.sortieAir === "toiture" ? "Toiture (sur demande)" : data.boiler.sortieAir === "interieure" ? "Dans la pièce" : "-"}</td></tr>
                <tr><th>Pièce / volume</th><td>{tv(data.boiler.piece)} {data.boiler.surface && data.boiler.hauteur ? `(${((+data.boiler.surface) * (+data.boiler.hauteur)).toFixed(1)} m³)` : ""}</td></tr>
                <tr><th>Arrivée eau froide</th><td>{tv(data.boiler.arriveeFroide)}</td></tr>
                <tr><th>Départ eau chaude</th><td>{tv(data.boiler.departChaude)}</td></tr>
                <tr><th>Collecteur sanitaire</th><td>{tv(data.boiler.collecteur)}</td></tr>
                <tr><th>Condensats</th><td>{tv(data.boiler.condensats)}</td></tr>
              </tbody></table>
            </div>
          )}

          {data.comments && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: GREEN, textTransform: "uppercase", marginBottom: 6 }}>Commentaires</div>
              <div style={{ padding: 10, background: BG, borderRadius: 6, whiteSpace: "pre-wrap" }}>{data.comments}</div>
            </div>
          )}

          <div style={{ marginTop: 18 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: GREEN, textTransform: "uppercase", marginBottom: 6 }}>Coût indicatif matériel + main d'oeuvre boiler</div>
            <div style={{ padding: 12, background: GREEN_LIGHT, borderRadius: 8, fontWeight: 700, fontSize: 16, color: GREEN }}>≈ {total ? total.toLocaleString("fr-BE") + " €" : "à calculer"}</div>
            <div style={{ fontSize: 11, color: MUTED, marginTop: 4 }}>Base tarifs LG (Configurateur 2.0) / Atlantic (Chauraci, 29/09/2026), hors marge et hors accès difficile, distance &gt;{TUBAGE_INCLUS_M}m ou gainage &gt;{BOILER_GAINAGE_INCLUS_M}m. Coût matériel + MO uniquement : le prix de vente client (avec marge et commission) se calcule dans l'onglet Calcul du prix.</div>
          </div>

          {missing.length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: ORANGE, textTransform: "uppercase", marginBottom: 6 }}>Informations manquantes / points d'attention</div>
              <ul style={{ marginLeft: 18, fontSize: 12.5 }}>{missing.map((m, i) => <li key={i}>{m}</li>)}</ul>
            </div>
          )}

          {["pac_rooms_photos", "pac_ue_photos", "elec_photos", "boiler_photos"].map(() => null)}
          {[
            ...data.pac.rooms.flatMap(r => (r.photos || []).map(p => ({ ...p, cat: "Pièce : " + (r.nom || "-") }))),
            ...data.pac.outdoorUnits.flatMap(u => (u.photos || []).map(p => ({ ...p, cat: "Unité extérieure : " + (u.emplacement || "-") }))),
            ...(data.elec.photos || []).map(p => ({ ...p, cat: "Électricité" })),
            ...(data.modules.boiler ? (data.boiler.photos || []).map(p => ({ ...p, cat: "Boiler" })) : []),
          ].length > 0 && (
            <div style={{ marginTop: 18 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: GREEN, textTransform: "uppercase", marginBottom: 8 }}>Photos</div>
              <div className="photo-grid avoid-break">
                {[
                  ...data.pac.rooms.flatMap(r => (r.photos || []).map(p => ({ ...p, cat: r.nom }))),
                  ...data.pac.outdoorUnits.flatMap(u => (u.photos || []).map(p => ({ ...p, cat: u.emplacement }))),
                  ...(data.elec.photos || []).map(p => ({ ...p, cat: "Électricité" })),
                  ...(data.modules.boiler ? (data.boiler.photos || []).map(p => ({ ...p, cat: "Boiler" })) : []),
                ].map((p, i) => (
                  <div key={i} className="avoid-break">
                    <img src={p.url} style={{ width: "100%", height: 110, objectFit: "cover", borderRadius: 6, border: "1px solid " + BORDER }} />
                    <div style={{ fontSize: 10, color: MUTED }}>{p.cat}{p.note ? " : " + p.note : ""}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== CALCUL DU PRIX ============================== */
function PriceTab({ data, pricing, setPricing }) {
  const bd = computeDevisBreakdown(data, pricing);
  const fmt = n => (Math.round(n * 100) / 100).toLocaleString("fr-BE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  const setOverride = (key, val) => {
    const overrides = { ...(pricing.overrides || {}) };
    if (val === "") delete overrides[key]; else overrides[key] = val;
    setPricing({ ...pricing, overrides });
  };

  // Modèles retenus : lecture des choix faits dans les onglets Pompe à chaleur / Boiler.
  const modeles = [];
  data.pac.outdoorUnits.forEach((u, i) => {
    const line = bd.lines.find(l => l.key === `ue-${u.id}`);
    if (line && line.code && line.code !== "à définir") {
      const spec = OUTDOOR_UNITS.find(o => o.code === line.code);
      modeles.push({
        type: "Unité extérieure", repere: u.emplacement || `UE ${i + 1}`, code: shortModelCode(line.code),
        spec: spec ? `${spec.kwFroid} kW froid / ${spec.kwChaud} kW chaud · réf. ${spec.ref}` : "mono-split",
      });
    }
  });
  data.pac.rooms.forEach((r, i) => {
    const unit = getEffectiveIndoorUnit(r);
    if (unit) modeles.push({ type: "Unité intérieure", repere: r.nom || `Unité ${i + 1}`, code: shortModelCode(unit.code), spec: `${unit.gamme} · ${unit.kwFroid} kW froid / ${unit.kwChaud} kW chaud · réf. ${unit.ref}` });
  });
  if (data.modules.boiler && data.boiler.volumeSouhaite) {
    const b = BOILERS.find(x => x.key === data.boiler.volumeSouhaite);
    if (b) {
      const tags = [b.hasCoil ? "coil" : null, b.split ? "split" : null].filter(Boolean);
      modeles.push({ type: "Boiler thermodynamique", repere: b.label, code: b.ref, spec: `${b.volume} L${tags.length ? " · " + tags.join(", ") : ""} · MO ${DEFAULT_BOILER_MO_INSTALLATION} € + raccord ${DEFAULT_BOILER_RACCORD_MATERIEL} €` });
      if (b.split) modeles.push({ type: "Unité extérieure boiler", repere: CALYPSO_OUTDOOR.label, code: CALYPSO_OUTDOOR.ref, spec: `${CALYPSO_OUTDOOR.price.toFixed(2)} € HTVA` });
    }
  }

  return (
    <div className="no-print">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
        <SectionHeader sub="Modèles retenus, détail des lignes de coût (modifiables) puis calcul de la marge et de la commission.">Calcul du prix</SectionHeader>
      </div>

      <Card title="Modèles retenus">
        {modeles.length === 0 ? (
          <div style={{ fontSize: 12, color: MUTED }}>Aucun modèle sélectionné pour le moment (onglets Pompe à chaleur / Boiler thermo).</div>
        ) : (
          <table className="preview-table"><thead>
            <tr><th>Type</th><th>Repère</th><th>Modèle</th><th>Caractéristiques</th></tr>
          </thead><tbody>
            {modeles.map((m, i) => <tr key={i}><td>{m.type}</td><td>{m.repere}</td><td style={{ fontWeight: 700 }}>{m.code}</td><td>{m.spec}</td></tr>)}
          </tbody></table>
        )}
      </Card>

      <Card title="Lignes de produits et services">
        <div style={{ fontSize: 11.5, color: MUTED, marginBottom: 10 }}>
          Un tarif par défaut est calculé automatiquement pour chaque ligne. Modifiez le champ "Tarif retenu" pour surcharger manuellement une ligne :
          elle apparaît alors avec un <span style={{ background: ORANGE_BG, color: ORANGE, fontWeight: 700, padding: "1px 6px", borderRadius: 4 }}>fond orange</span> pour la distinguer des lignes au tarif par défaut.
        </div>
        {bd.lines.length === 0 ? (
          <div style={{ fontSize: 12, color: MUTED }}>Aucune ligne pour le moment (onglet Pompe à chaleur / Boiler).</div>
        ) : (
          <table className="preview-table"><thead>
            <tr><th>Ligne</th><th style={{ width: "12%" }}>Réf.</th><th style={{ width: "9%" }}>Qté</th><th style={{ width: "16%" }}>Tarif par défaut</th><th style={{ width: "18%" }}>Tarif retenu</th><th style={{ width: "6%" }}></th></tr>
          </thead><tbody>
            {bd.lines.map(l => (
              <tr key={l.key} style={l.overridden ? { background: ORANGE_BG } : undefined}>
                <td>{l.label}{l.overridden && <span style={{ marginLeft: 6, fontSize: 10, fontWeight: 700, color: ORANGE }}>● modifié</span>}</td>
                <td>{l.code || "-"}</td>
                <td>{l.qty}</td>
                <td>{fmt(l.defaultTotal)} €</td>
                <td>
                  <input type="number" step="1" placeholder={fmt(l.defaultTotal)}
                    value={pricing.overrides && pricing.overrides[l.key] != null ? pricing.overrides[l.key] : ""}
                    onChange={e => setOverride(l.key, e.target.value)} style={{ width: "100%" }} />
                </td>
                <td>{l.overridden && <button onClick={() => setOverride(l.key, "")} title="Revenir au tarif par défaut" style={{ background: "none", border: "none", color: MUTED, fontSize: 16 }}>↺</button>}</td>
              </tr>
            ))}
          </tbody></table>
        )}
        <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, maxWidth: 520 }}>
          <div style={{ fontSize: 12.5 }}>Sous-total lignes</div><div style={{ fontSize: 12.5, fontWeight: 700, textAlign: "right" }}>{fmt(bd.coutMateriel)} €</div>
        </div>
        <div style={{ marginTop: 8 }}>
          <Field label="Frais annexes (accessoires spécifiques, suppléments hors lignes ci-dessus)" hint="Montant en €, coût réel, hors marge.">
            <input type="number" step="10" value={pricing.fraisAnnexes} onChange={e => setPricing({ ...pricing, fraisAnnexes: e.target.value })} style={{ maxWidth: 200 }} />
          </Field>
        </div>
        <div style={{ marginTop: 6, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, maxWidth: 520 }}>
          <div style={{ fontSize: 13, borderTop: `1px solid ${BORDER}`, paddingTop: 6, fontWeight: 700 }}>Coût total</div><div style={{ fontSize: 13, fontWeight: 700, textAlign: "right", borderTop: `1px solid ${BORDER}`, paddingTop: 6 }}>{fmt(bd.coutTotal)} €</div>
        </div>
      </Card>

      <Card title="Marge, commission et prix final">
        <div className="g3">
          <Field label="Multiplicateur de marge" hint="Prix de vente = coût total × multiplicateur. Défaut : 1,4.">
            <input type="number" step="0.05" min="1" value={pricing.multiplicateur} onChange={e => setPricing({ ...pricing, multiplicateur: e.target.value })} />
          </Field>
          <Field label="Commission (% de la marge, ajoutée au prix)">
            <div style={{ display: "flex", gap: 6 }}>
              {COMMISSION_STEPS.map(p => (
                <button key={p} onClick={() => setPricing({ ...pricing, commissionPct: p })}
                  style={{ flex: 1, padding: "8px 0", borderRadius: 6, border: "1px solid " + (Number(pricing.commissionPct) === p ? GREEN : BORDER), background: Number(pricing.commissionPct) === p ? GREEN : WHITE, color: Number(pricing.commissionPct) === p ? WHITE : TEXT, fontWeight: 700, fontSize: 13 }}>
                  {p}%
                </button>
              ))}
            </div>
          </Field>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, maxWidth: 520 }}>
          <div style={{ fontSize: 12.5 }}>Prix de vente (coût × {pricing.multiplicateur || 1})</div><div style={{ fontSize: 12.5, fontWeight: 700, textAlign: "right" }}>{fmt(bd.prixVente)} €</div>
          <div style={{ fontSize: 12.5, color: PURPLE }}>Marge brute</div><div style={{ fontSize: 12.5, fontWeight: 700, textAlign: "right", color: PURPLE }}>{fmt(bd.marge)} € ({fmt(bd.margePct)}%)</div>
          <div style={{ fontSize: 12.5 }}>Commission ({bd.commissionPct}% de la marge)</div><div style={{ fontSize: 12.5, fontWeight: 700, textAlign: "right" }}>{fmt(bd.commission)} €</div>
        </div>
        <div style={{ marginTop: 14, padding: 14, background: GREEN_LIGHT, borderRadius: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div style={{ fontWeight: 700, color: GREEN }}>PRIX FINAL CLIENT (HTVA)</div>
          <div style={{ fontWeight: 700, color: GREEN, fontSize: 22 }}>{fmt(bd.prixFinal)} €</div>
        </div>
        <div style={{ fontSize: 11, color: MUTED, marginTop: 6 }}>Marge et commission restent internes : seul le prix final apparaît sur le devis client (onglet Devis).</div>
      </Card>
    </div>
  );
}

function T(lang, key, ...args) {
  const entry = DEVIS_I18N[key];
  if (!entry) return key;
  const val = entry[lang] || entry.FR;
  return typeof val === "function" ? val(...args) : val;
}

}
function DevisSubH({ children }) {
  return <div style={{ display: "flex", alignItems: "center", gap: 7, color: PURPLE, fontWeight: 700, fontSize: 12.5, margin: "10px 0 5px", pageBreakAfter: "avoid", breakAfter: "avoid" }}><span style={{ width: 4, height: 12, background: PURPLE, borderRadius: 2, display: "inline-block", flex: "0 0 auto" }}></span>{children}</div>;
}
function DevisCard({ label, children, big }) {
  return (
    <div style={{ background: big ? `linear-gradient(135deg, ${GREEN} 0%, #12492a 100%)` : BG, border: big ? "none" : `1px solid ${BORDER}`, borderLeft: big ? "none" : `3px solid ${GREEN}`, borderRadius: big ? 8 : "0 8px 8px 0", padding: "9px 13px" }}>
      {label && <div style={{ fontSize: 10, fontWeight: 800, color: big ? "#eaf3ec" : DEVIS_GREEN_DEEP, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</div>}
      <div style={{ fontSize: big ? 19 : 13, fontWeight: 700, color: big ? WHITE : TEXT, marginTop: label ? 3 : 0 }}>{children}</div>
    </div>
  );
}
function DevisPill({ children }) {
  return <span style={{ display: "inline-flex", alignItems: "center", background: "#eef3e9", color: "#3d4a14", border: `1px solid ${DEVIS_GREEN}`, fontSize: 10.5, fontWeight: 700, padding: "4px 11px", borderRadius: 20, marginRight: 6, marginBottom: 6 }}>{children}</span>;
}
