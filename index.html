                <tr><td>{outdoorLines.length + indoorAssign.length + 3}</td><td>{t("rowCommissioning")}</td><td>{t("commissioningDesc")}</td><td colSpan="2">{t("included")}</td></tr>
                <tr><td>{outdoorLines.length + indoorAssign.length + 4}</td><td>{t("rowTechVisit")}</td><td>{t("techVisitDesc")}</td><td colSpan="2">{t("included")}</td></tr>
                <tr><td>{outdoorLines.length + indoorAssign.length + 5}</td><td>{t("rowExtraMeters")}</td><td>{t("extraMetersDesc", TUBAGE_INCLUS_M)}</td><td colSpan="2">{t("notIncludedPrice", DEFAULT_TUBAGE_PAR_M)}</td></tr>
              </tbody></table>
              <div style={{ fontSize: 10.5, fontStyle: "italic", color: MUTED, marginTop: 3, marginBottom: 10 }}>{t("footnote22")}</div>
            </React.Fragment>
          )}

          {boilerSel && (
            <React.Fragment>
              <DevisSubH>{data.modules.pac ? "2.3" : "2.1"} {t("boilerSectionTitle")}</DevisSubH>
              <table className="preview-table avoid-break devis-table"><tbody>
                <tr><th>{t("boilerModel")}</th><td>{t("boilerModelValue", boilerSel.label, boilerSel.ref)}</td></tr>
                <tr><th>{t("boilerIncluded")}</th><td>{t("boilerIncludedValue")}</td></tr>
              </tbody></table>
              {(boilerSel.hasCoil || boilerSel.split || data.boiler.aEvacuer || data.boiler.sortieAir === "mur6" || data.boiler.sortieAir === "mur-plus" || data.boiler.sortieAir === "toiture") && (
                <ul style={{ marginLeft: 18, marginBottom: 8 }}>
                  {boilerSel.hasCoil && <li>{t("boilerExtraCoil")}</li>}
                  {boilerSel.split && <li>{t("boilerExtraSplit")}</li>}
                  {data.boiler.aEvacuer && <li>{t("boilerExtraEvac")}</li>}
                  {data.boiler.sortieAir === "mur6" && <li>{t("boilerExtraAirMur")}</li>}
                  {(data.boiler.sortieAir === "mur-plus" || data.boiler.sortieAir === "toiture") && <li>{t("boilerExtraAirSurMesure")}</li>}
                </ul>
              )}
            </React.Fragment>
          )}

          {(outdoorSpec || indoorAssign.length > 0) && (
            <React.Fragment>
              <DevisSecBar>{t("sec3Title")}</DevisSecBar>
              <div style={{ marginBottom: 8 }}>
                <DevisPill>R32</DevisPill><DevisPill>Dual Inverter</DevisPill><DevisPill>Wi-Fi</DevisPill><DevisPill>Google Assistant</DevisPill>
              </div>
              <p style={{ marginBottom: 10 }}>{t("sec3Paragraph", gammesUsed.length ? gammesUsed.join(", ") : "Standard Plus")}</p>

              {outdoorSpec && (
                <React.Fragment>
                  <DevisSubH>3.1 {t("sec31OutdoorTitle", shortModelCode(outdoorSpec.code))}</DevisSubH>
                  <table className="preview-table avoid-break devis-table compact"><tbody>
                    <tr><th>{t("coolingCapacity")}</th><td>{outdoorSpec.kwFroid ? t("kwNominal", outdoorSpec.kwFroid) : "-"}</td></tr>
                    <tr><th>{t("heatingCapacity")}</th><td>{outdoorSpec.kwChaud ? t("kwNominal", outdoorSpec.kwChaud) : "-"}</td></tr>
                    <tr><th>{t("reference")}</th><td>{outdoorSpec.ref}</td></tr>
                    <tr><th>{t("refrigerant")}</th><td>R32</td></tr>
                    <tr><th>{t("connections")}</th><td>{t("connectionsValue", outdoorSpec.nb[outdoorSpec.nb.length - 1])}</td></tr>
                  </tbody></table>
                </React.Fragment>
              )}
              {indoorAssign.length > 0 && (
                <React.Fragment>
                  <DevisSubH>{outdoorSpec ? "3.2" : "3.1"} {t("sec32IndoorTitle")}</DevisSubH>
                  <table className="preview-table avoid-break devis-table compact"><thead>
                    <tr><th>{t("thModel")}</th><th>{t("thGamme")}</th><th>{t("thRoom")}</th><th>{t("thPowerCoolHeat")}</th><th>{t("thReference")}</th></tr>
                  </thead><tbody>
                    {indoorAssign.map(({ r, unit }, idx) => (
                      <tr key={idx}><td>{shortModelCode(unit.code)}</td><td>{unit.gamme}</td><td>{r.nom || "-"}</td><td>{unit.kwFroid} / {unit.kwChaud} kW</td><td>{unit.ref}</td></tr>
                    ))}
                  </tbody></table>
                </React.Fragment>
              )}
              <div style={{ fontSize: 10.5, fontStyle: "italic", color: MUTED, marginTop: 4 }}>{t("footnote3")}</div>
            </React.Fragment>
          )}

          <DevisSecBar>{t("sec4Title")}</DevisSecBar>
          <p style={{ marginBottom: 8, fontWeight: 700 }}>{t("sec4Paragraph", fmt(bd.prixFinal))}</p>
          <p style={{ marginBottom: 4, fontSize: 11, color: MUTED }}>{t("sec4Vat")}</p>

          <DevisSecBar>{t("sec5Title")}</DevisSecBar>
          <DevisSubH>{t("sec51Title")}</DevisSubH>
          <ul style={{ marginLeft: 18, marginBottom: 8 }}>
            <li>{t("payment1")}</li>
            <li>{t("payment2")}</li>
            <li>{t("payment3")}</li>
          </ul>
          <DevisSubH>{t("sec52Title")}</DevisSubH>
          <p style={{ marginBottom: 8 }}>{t("deliveryText")}</p>
          <DevisSubH>{t("sec53Title")}</DevisSubH>
          <p style={{ marginBottom: 8 }}>{t("qualityText")}</p>
          <DevisSubH>{t("sec54Title")}</DevisSubH>
          <ul style={{ marginLeft: 18, marginBottom: 8 }}>
            <li>{t("warranty1")}</li>
            <li>{t("warranty2")}</li>
            <li>{t("warranty3")}</li>
          </ul>
          <div style={{ fontSize: 10.5, fontStyle: "italic", color: MUTED, marginBottom: 4 }}>{t("footnote54")}</div>

          <DevisSecBar>{t("sec6Title")}</DevisSecBar>
          <div className="g2" style={{ marginBottom: 10 }}>
            <DevisCard><div style={{ color: PURPLE, fontWeight: 700 }}>{t("card1Title")}</div><div style={{ fontSize: 11, fontWeight: 400, color: TEXT, marginTop: 3 }}>{t("card1Body", data.chantier.technicien || t("labelProjectManager"))}</div></DevisCard>
            <DevisCard><div style={{ color: PURPLE, fontWeight: 700 }}>{t("card2Title")}</div><div style={{ fontSize: 11, fontWeight: 400, color: TEXT, marginTop: 3 }}>{t("card2Body")}</div></DevisCard>
            <DevisCard><div style={{ color: PURPLE, fontWeight: 700 }}>{t("card3Title")}</div><div style={{ fontSize: 11, fontWeight: 400, color: TEXT, marginTop: 3 }}>{t("card3Body")}</div></DevisCard>
            <DevisCard><div style={{ color: PURPLE, fontWeight: 700 }}>{t("card4Title")}</div><div style={{ fontSize: 11, fontWeight: 400, color: TEXT, marginTop: 3 }}>{t("card4Body")}</div></DevisCard>
          </div>

          <DevisSecBar>{t("sec7Title")}</DevisSecBar>
          <p style={{ marginBottom: 10, color: MUTED }}>{t("signatureIntro", data.client.nom || "________________")}</p>
          <div className="g2 avoid-break">
            <div>
              <div style={{ borderBottom: `1px solid ${MUTED}`, height: 40 }}></div>
              <div style={{ fontSize: 10.5, color: MUTED, marginTop: 3 }}>{t("clientSignatureLabel")}</div>
            </div>
            <div>
              <div style={{ fontWeight: 700, marginBottom: 24, fontSize: 11.5 }}>{t("weGreenProposalText")}</div>
              <div style={{ borderBottom: `1px solid ${MUTED}`, height: 20 }}></div>
              <div style={{ fontSize: 10.5, color: MUTED, marginTop: 3 }}>{t("weGreenSignatureLabel", data.chantier.technicien)}</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}


/* ============================== APP ============================== */
function App() {
  const [tab, setTab] = useState("chantier");
  const [client, setClient] = useState({ nom: "", adresse: "", tel: "", email: "", langue: "FR" });
  const [chantier, setChantier] = useState({ date: "", technicien: "" });
  const [modules, setModules] = useState({ pac: true, boiler: true });
  const [comments, setComments] = useState("");
  const [pac, setPac] = useState({ typeProjet: "", usage: "", rooms: [], outdoorUnits: [] });
  const [elec, setElec] = useState({ point: "", priseExistante: "", distance: "", reseau: "", cheminement: "", puissanceDispo: "", tableauAdapter: "", remarque: "", photos: [] });
  const [boiler, setBoiler] = useState({ systemeActuel: "", volumeActuel: "", ageActuel: "", aEvacuer: false, occupants: "", volumeSouhaite: "", piece: "", surface: "", hauteur: "", dimAcces: "", evacEau: "", raccordElec: "", condensats: "", longueurGainage: "", sortieAir: "", arriveeFroide: "", departChaude: "", collecteur: "", photos: [] });
  const [pricing, setPricing] = useState({ multiplicateur: 1.4, commissionPct: 25, fraisAnnexes: 0, overrides: {} });

  const totalKwChaud = useMemo(() => pac.outdoorUnits.reduce((sum, u) => {
    const eligible = pac.rooms.filter(r => (u.roomIds || []).includes(r.id)).map(r => {
      const { suggestion } = computeRoomPower(r);
      return { indexVal: suggestion ? suggestion.index : 0, suggestedCode: suggestion ? suggestion.code : null };
    });
    const res = suggestOutdoor(eligible);
    if (res.ok && !res.mono) return sum + (res.best.kwChaud || 0);
    return sum;
  }, 0), [pac]);

  const data = { client, chantier, modules, comments, pac, elec, boiler };
  const TABS = [
    { key: "chantier", label: "🏠 Chantier" },
    { key: "pac", label: "❄️ Pompe à chaleur" },
    { key: "elec", label: "⚡ Électricité" },
    { key: "boiler", label: "🚿 Boiler thermo" },
    { key: "prix", label: "🧮 Calcul du prix" },
    { key: "rapport", label: "📋 Briefing installateur" },
    { key: "devis", label: "💶 Devis" },
  ];

  return (
    <div>
      <div className="no-print" style={{ background: WHITE, borderBottom: `1px solid ${BORDER}`, padding: "14px 20px", position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ fontWeight: 700, color: GREEN, fontSize: 16 }}>🌿 We Green Energy</div>
        <div style={{ fontSize: 13, color: MUTED }}>Briefing de chantier : Pompes à chaleur & Boilers thermodynamiques (prototype)</div>
      </div>

      <div className="no-print" style={{ display: "flex", gap: 6, padding: "10px 16px", background: WHITE, borderBottom: `1px solid ${BORDER}`, flexWrap: "wrap", position: "sticky", top: 62, zIndex: 9 }}>
        {TABS.map(t => (
          <button key={t.key} onClick={() => setTab(t.key)}
            style={{ padding: "8px 14px", borderRadius: 20, border: "1px solid " + (tab === t.key ? GREEN : BORDER), background: tab === t.key ? GREEN : WHITE, color: tab === t.key ? WHITE : TEXT, fontWeight: 600, fontSize: 13 }}>
            {t.label}
          </button>
        ))}
      </div>

      <div style={{ maxWidth: 900, margin: "0 auto", padding: "20px 16px 60px" }}>
        {tab === "chantier" && (
          <div>
            <SectionHeader sub="Informations générales du chantier.">Chantier</SectionHeader>
            <Card title="Client">
              <div className="g2">
                <Field label="Nom du client"><input value={client.nom} onChange={e => setClient({ ...client, nom: e.target.value })} /></Field>
                <Field label="Adresse du chantier"><input value={client.adresse} onChange={e => setClient({ ...client, adresse: e.target.value })} /></Field>
                <Field label="Téléphone"><input value={client.tel} onChange={e => setClient({ ...client, tel: e.target.value })} /></Field>
                <Field label="Email"><input value={client.email} onChange={e => setClient({ ...client, email: e.target.value })} /></Field>
                <Field label="Langue du client">
                  <select value={client.langue || "FR"} onChange={e => setClient({ ...client, langue: e.target.value })}>
                    <option value="FR">Français (FR)</option>
                    <option value="NL">Nederlands (NL)</option>
                    <option value="EN">English (EN)</option>
                  </select>
                </Field>
              </div>
              {client.langue && client.langue !== "FR" && (
                <div style={{ marginTop: 8 }}>
                  <Alert type="info">Le devis sera automatiquement traduit en {client.langue === "NL" ? "néerlandais" : "anglais"} dans l'onglet Devis.</Alert>
                </div>
              )}
            </Card>
            <Card title="Visite">
              <div className="g2">
                <Field label="Date"><input type="date" value={chantier.date} onChange={e => setChantier({ ...chantier, date: e.target.value })} /></Field>
                <Field label="Technicien"><input value={chantier.technicien} onChange={e => setChantier({ ...chantier, technicien: e.target.value })} /></Field>
              </div>
            </Card>
            <Card title="Modules concernés par ce chantier">
              <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, cursor: "pointer" }}>
                <input type="checkbox" checked={modules.pac} onChange={e => setModules({ ...modules, pac: e.target.checked })} />
                <span style={{ fontWeight: 400 }}>Pompe à chaleur air/air</span>
              </label>
              <label style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
                <input type="checkbox" checked={modules.boiler} onChange={e => setModules({ ...modules, boiler: e.target.checked })} />
                <span style={{ fontWeight: 400 }}>Boiler thermodynamique</span>
              </label>
            </Card>
            <Card title="Commentaires généraux">
              <textarea rows="3" value={comments} onChange={e => setComments(e.target.value)} placeholder="Contexte général, demandes particulières du client, visite technique complémentaire nécessaire..." />
            </Card>
          </div>
        )}

        {tab === "pac" && modules.pac && <PacTab pac={pac} setPac={setPac} />}
        {tab === "pac" && !modules.pac && <Alert type="warn">Le module "Pompe à chaleur" est désactivé pour ce chantier (voir onglet Chantier).</Alert>}

        {tab === "elec" && <ElecTab elec={elec} setElec={setElec} totalKwChaud={totalKwChaud} boilerActive={modules.boiler} />}

        {tab === "boiler" && modules.boiler && <BoilerTab boiler={boiler} setBoiler={setBoiler} />}
        {tab === "boiler" && !modules.boiler && <Alert type="warn">Le module "Boiler thermodynamique" est désactivé pour ce chantier (voir onglet Chantier).</Alert>}

        {tab === "prix" && <PriceTab data={data} pricing={pricing} setPricing={setPricing} />}
        {tab === "rapport" && <ReportTab data={data} />}
        {tab === "devis" && <DevisTab data={data} pricing={pricing} setPricing={setPricing} />}
      </div>

      <div className="no-print" style={{ textAlign: "center", fontSize: 11, color: MUTED, padding: "0 16px 30px" }}>
        Prototype de démonstration, données conservées uniquement dans cette page (aucune sauvegarde). Fermer l'onglet efface les données.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
